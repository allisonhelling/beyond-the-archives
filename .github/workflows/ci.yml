name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --grep-invert @performance
      - run: npm run perf:browser
      - run: npm ci --prefix reader
      - run: npm run build --prefix reader
      - run: npx playwright test tests/browser/calibre.spec.ts tests/browser/cloud.spec.ts
        working-directory: reader
      - uses: actions/upload-artifact@v7
        if: failure() && hashFiles('test-results/**') != ''
        with:
          name: browser-failures
          path: test-results/
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run db:reset
      - run: npm run db:lint
      - run: npm run test:integration
      - run: npx supabase stop
        if: always()
  deploy-database:
    name: Deploy Production Database
    needs: [checks, supabase]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-database
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check Deployment Secrets
        shell: bash
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - run: npm ci
      - name: Link Production Project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Preview Pending Migrations
        run: npx supabase db push --linked --skip-vault --dry-run
      - name: Apply Pending Migrations
        run: npx supabase db push --linked --skip-vault --yes

  calibre-transfer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s companions/calibre/tests -v
      - run: python companions/calibre/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: calibre-plugin-${{ matrix.os }}
          path: companions/calibre/dist/archives-unfolded-calibre.zip
