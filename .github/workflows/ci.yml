name: CI
on: [push, pull_request]
permissions:
  contents: read
env:
  VITE_APP_ENV: local
  VITE_SUPABASE_PROJECT_REF: local
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_build_only
  VITE_ORGANIZER_URL: http://127.0.0.1:5173/
  VITE_READER_URL: http://127.0.0.1:5174/
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
      - run: npm audit --audit-level=moderate
  browser:
    name: Browser Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run test:e2e:ci -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure() && hashFiles('test-results/**') != ''
        with:
          name: browser-failures-${{ matrix.shard }}
          path: test-results/
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run perf:browser
      - uses: actions/upload-artifact@v7
        if: failure() && hashFiles('test-results/**') != ''
        with:
          name: performance-failures
          path: test-results/
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            reader/package-lock.json
      - run: npm ci
      - run: npm ci --prefix reader
      - run: npm run build --prefix reader
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/calibre.spec.ts tests/browser/cloud.spec.ts
        working-directory: reader
      - uses: actions/upload-artifact@v7
        if: failure() && hashFiles('reader/test-results/**') != ''
        with:
          name: reader-browser-failures
          path: reader/test-results/
  checks:
    if: ${{ always() }}
    needs: [quality, browser, performance, reader]
    runs-on: ubuntu-latest
    steps:
      - name: Require All Checks to Pass
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.browser.result }}" = success
          test "${{ needs.performance.result }}" = success
          test "${{ needs.reader.result }}" = success
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:lint
      - run: npm run test:integration
      - run: npm run db:stop
        if: always()
  # Production releases require a separately approved workflow and hosted gate.
  # Ordinary push/PR CI has no deployment job or production credential bindings.

  calibre-transfer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s companions/calibre/tests -v
      - run: python companions/calibre/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: calibre-plugin-${{ matrix.os }}
          path: companions/calibre/dist/archives-unfolded-calibre.zip
