project_id = "beyond-the-archives"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/callback", "http://127.0.0.1:5174", "http://127.0.0.1:4174", "http://127.0.0.1:5174/auth/callback", "http://127.0.0.1:4174/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/before_user_created"

[auth.email]
# Approved beta addresses use email/password signup with email confirmation.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[functions.account-status]
# Handler verifies every bearer token with Supabase Auth; supports modern signing keys.
verify_jwt = false

[functions.import-worker]
verify_jwt = false # Dedicated IMPORT_WORKER_TOKEN is checked inside the handler.

[functions.extension-metadata]
verify_jwt = false # Handler verifies each user bearer token through Supabase Auth.

[functions.series-preview]
verify_jwt = false # Handler verifies each bearer token with Supabase Auth.

[functions.save-backup]
verify_jwt = false # Handler verifies bearer tokens with Auth before lease/Storage access.

[functions.tag-resolution]
verify_jwt = false # Handler verifies bearer tokens with Auth before cache access.

[functions.wayback-lookup]
verify_jwt = false # Handler verifies each bearer token with Supabase Auth.

[functions.reader-inbox]
verify_jwt = false # Handler verifies a revocable, delivery-only reader pairing token.

[functions.app-login]
verify_jwt = false # Issue verifies Auth; redeem consumes a verifier-bound one-time handoff.
